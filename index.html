<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Skin Preview</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- UI Overlay -->
    <div class="ui-panel">
      <h1>SKIN PREVIEW</h1>
      
      <div id="drop-zone" class="drop-zone">
        <p>Kéo thả ảnh JPG/PNG vào đây</p>
        <p class="small">Hoặc click để chọn</p>
        <input type="file" id="file-input" accept="image/png, image/jpeg" style="display: none;" />
      </div>

      <div class="controls">
        <div class="control-group">
          <label>Fit Mode</label>
          <div class="radio-group">
            <label><input type="radio" name="fit" value="cover" checked> Cover</label>
            <label><input type="radio" name="fit" value="contain"> Contain</label>
          </div>
        </div>

        <div class="control-group">
          <label>Scale <span id="scale-val">(1.00x)</span></label>
          <input type="range" id="scale" min="0.1" max="3" step="0.01" value="1">
        </div>

        <div class="control-group">
          <label>Offset X <span id="offset-x-val">(0.00)</span></label>
          <input type="range" id="offset-x" min="-1" max="1" step="0.01" value="0">
        </div>

        <div class="control-group">
          <label>Offset Y <span id="offset-y-val">(0.00)</span></label>
          <input type="range" id="offset-y" min="-1" max="1" step="0.01" value="0">
        </div>
      </div>
      
      <div class="actions">
        <button id="reset-camera">Reset Camera</button>
        <button id="reset-image" class="secondary">Reset Image</button>
      </div>

      <div class="camera-views">
        <button data-view="front">FRONT</button>
        <button data-view="back">BACK</button>
        <button data-view="left">LEFT</button>
        <button data-view="right">RIGHT</button>
        <button data-view="top">TOP</button>
        <button data-view="bottom">BOTTOM</button>
        <button data-view="3d">3D</button>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
