<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Skin Preview</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- Floating Settings Button -->
    <button id="open-settings" class="floating-btn" aria-label="Open Settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    
    <!-- UI Overlay -->
    <div class="ui-panel" id="ui-panel">
      <div class="panel-header">
        <h1>SKIN PREVIEW</h1>
        <button id="close-settings" class="icon-btn" aria-label="Close Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      
      <div id="drop-zone" class="drop-zone">
        <p>Kéo thả ảnh JPG/PNG vào đây</p>
        <p class="small">Hoặc click để chọn</p>
        <input type="file" id="file-input" accept="image/png, image/jpeg" style="display: none;" />
      </div>

      <div class="controls">
        <div class="control-group">
          <label>Fit Mode</label>
          <div class="radio-group">
            <label><input type="radio" name="fit" value="cover" checked> Cover</label>
            <label><input type="radio" name="fit" value="contain"> Contain</label>
          </div>
        </div>

        <div class="control-group">
          <label>Bề mặt (Finish)</label>
          <select id="skin-finish" class="select-input">
            <option value="glossy">Bóng (Glossy)</option>
            <option value="matte" selected>Nhám (Matte)</option>
            <option value="leather">Da (Leather)</option>
          </select>
        </div>

        <div class="control-group">
          <div class="label-row">
            <label>Scale</label>
            <input type="number" id="scale-num" class="num-input" min="0.1" max="3" step="0.01" value="1.00">
          </div>
          <input type="range" id="scale" min="0.1" max="3" step="0.01" value="1">
        </div>

        <div class="control-group">
          <div class="label-row">
            <label>Offset X</label>
            <input type="number" id="offset-x-num" class="num-input" min="-1" max="1" step="0.01" value="0.00">
          </div>
          <input type="range" id="offset-x" min="-1" max="1" step="0.01" value="0">
        </div>

        <div class="control-group">
          <div class="label-row">
            <label>Offset Y</label>
            <input type="number" id="offset-y-num" class="num-input" min="-1" max="1" step="0.01" value="0.00">
          </div>
          <input type="range" id="offset-y" min="-1" max="1" step="0.01" value="0">
        </div>
      </div>
      
      <div class="actions">
        <button id="toggle-theme" class="secondary" style="flex: 0.5;">🌙</button>
        <button id="reset-camera">Reset Camera</button>
        <button id="reset-image" class="secondary">Reset Image</button>
      </div>

      <div class="camera-views">
        <button data-view="front">FRONT</button>
        <button data-view="back">BACK</button>
        <button data-view="left">LEFT</button>
        <button data-view="right">RIGHT</button>
        <button data-view="top">TOP</button>
        <button data-view="bottom">BOTTOM</button>
        <button data-view="3d">3D</button>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
